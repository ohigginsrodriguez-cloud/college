<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla</title>
</head>

<body>

    <style>
        table,
        th,
        td {
            border: 1px solid black; 
            border-collapse: collapse; 
        }
    </style>

    <table style="width: 100%">
        <tr>
            <th colspan="4">A</th> 
            <th colspan="4">B</th>
        </tr>

        <tr>
            <td colspan="2">C</td>
            <td colspan="2">D</td>
            <td colspan="2">E</td>
            <td colspan="2">F</td>
        </tr>

        <tr>
            <th rowspan="3">Color</th>
            <th>Rojo</th>
            <th rowspan="3">Tipo</th>
            <th>Talla</th>
            <th rowspan="3">Tiene</th>
            <th>1</th>
            <th rowspan="3">Para</th>
            <th>Ninos</th>
        </tr>

        <tr>
            <th>Blanco</th>
            <th>Mediano</th>
            <th>Jovenes</th>
        </tr>

        <tr>
            <th>Verde</th>
            <th>Chico</th>
            <th>Adultos</th>
        </tr>

        <tr>
            <th>1 </th>
            <th>2</th>
            <th>3</th>
            <th>4</th>
        </tr>

    </table>

</body>

</html>
